<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <title>SF Org Health Report</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f8;color:#1a202c;min-height:100vh}
    nav{background:linear-gradient(135deg,#1e3a5f 0%,#0070d2 100%);padding:16px 32px;display:flex;align-items:center;gap:14px}
    nav .logo{color:white;font-size:20px;font-weight:800;letter-spacing:-0.5px;text-decoration:none}
    nav .logo span{color:#7dd3fc}
    nav .nav-tag{color:rgba(255,255,255,0.6);font-size:13px}
    nav .nav-right{margin-left:auto}
    nav .btn-try{background:rgba(255,255,255,0.15);color:white;border:none;padding:8px 18px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;transition:background 0.2s}
    nav .btn-try:hover{background:rgba(255,255,255,0.25)}
    .main{max-width:900px;margin:36px auto;padding:0 20px}
    .card{background:white;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.07);padding:28px;margin-bottom:22px}
    .card h2{font-size:16px;font-weight:700;margin-bottom:20px;color:#1a202c;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .share-meta{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:1px solid #bfdbfe;border-radius:12px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
    .share-meta .label{font-size:12px;font-weight:700;color:#1e40af;text-transform:uppercase;letter-spacing:0.06em}
    .share-meta .val{font-size:13px;color:#374151;margin-top:2px}
    .score-hero{display:grid;grid-template-columns:180px 1fr;gap:28px;align-items:start}
    .gauge-wrap{text-align:center;background:linear-gradient(160deg,#f8faff,#eef4ff);border-radius:16px;padding:24px 16px 20px;border:1px solid #e0eaff}
    .gauge-score{font-size:60px;font-weight:900;line-height:1;letter-spacing:-2px}
    .gauge-grade{font-size:26px;font-weight:700;margin-top:4px}
    .gauge-sub{font-size:11px;color:#a0aec0;margin-top:2px}
    .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
    .stat-box{background:#f8fafc;border-radius:10px;padding:12px;border:1px solid #e8edf2}
    .stat-box .val{font-size:22px;font-weight:800;line-height:1}
    .stat-box .lbl{font-size:10px;color:#718096;margin-top:3px;font-weight:500}
    .cat-row{display:grid;grid-template-columns:120px 1fr 40px;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f7fafc}
    .cat-row:last-child{border-bottom:none}
    .cat-label{font-size:13px;font-weight:500;color:#4a5568}
    .bar-track{background:#e2e8f0;border-radius:99px;height:9px}
    .bar-fill{height:9px;border-radius:99px}
    .cat-score-val{font-size:14px;font-weight:700;text-align:right}
    .action-item{padding:12px 0;border-bottom:1px solid #f7fafc}
    .action-item:last-child{border-bottom:none}
    .action-top{display:grid;grid-template-columns:24px auto 1fr;gap:10px;align-items:start}
    .action-num{font-size:12px;color:#cbd5e0;font-weight:700;padding-top:2px;text-align:center}
    .badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;text-transform:uppercase;white-space:nowrap}
    .bg-critical{background:#fef2f2;color:#dc2626}
    .bg-high{background:#fff7ed;color:#ea580c}
    .bg-medium{background:#fefce8;color:#ca8a04}
    .bg-low{background:#f0fdf4;color:#16a34a}
    .dl-row{display:flex;gap:10px;flex-wrap:wrap}
    .dl-btn{padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid;text-decoration:none;display:inline-flex;align-items:center;gap:7px;transition:all 0.2s}
    .dl-btn:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,0.1)}
    .dl-btn.pdf{background:#fdf2f8;color:#7e22ce;border-color:#e9d5ff}
    .watermark{text-align:center;color:#a0aec0;font-size:12px;padding:24px 0;border-top:1px solid #f3f4f6;margin-top:8px}
    .watermark a{color:#0070d2;text-decoration:none;font-weight:600}
    .error-state{text-align:center;padding:60px 20px;color:#6b7280}
    .error-state h2{font-size:22px;font-weight:700;color:#1a202c;margin-bottom:10px}
    .loading-state{text-align:center;padding:60px 20px;color:#6b7280}
    .spinner{display:inline-block;width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:#0070d2;border-radius:50%;animation:spin 0.7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:600px){.score-hero{grid-template-columns:1fr}.stats-row{grid-template-columns:repeat(3,1fr)}.cat-row{grid-template-columns:90px 1fr 36px}}
    @media print{nav{-webkit-print-color-adjust:exact;print-color-adjust:exact}.watermark{display:none}}
  </style>
</head>
<body>

<nav>
  <a href="/" class="logo">SF<span>Health</span></a>
  <span class="nav-tag">Shared Report</span>
  <div class="nav-right">
    <a href="/app" class="btn-try">Run your own audit →</a>
  </div>
</nav>

<div class="main" id="main">
  <div class="loading-state">
    <div class="spinner"></div>
    <div style="margin-top:16px;font-size:14px;">Loading report…</div>
  </div>
</div>

<script>
const token = location.pathname.split("/share/")[1];

function scoreColor(s){return s>=80?"#16a34a":s>=60?"#ca8a04":"#dc2626"}
function gradeColor(g){return{A:"#16a34a",B:"#65a30d",C:"#ca8a04",D:"#ea580c",F:"#dc2626"}[g]||"#6b7280"}
function pColor(p){return{critical:"#dc2626",high:"#ea580c",medium:"#ca8a04",low:"#16a34a"}[p]||"#6b7280"}
function pClass(p){return"bg-"+(p||"low")}

const CAT_LABELS = {automation:"Automation",security:"Security",dataQuality:"Data Quality",apiUsage:"API & Limits",codeQuality:"Code Quality",userAdoption:"User Adoption"};

async function load(){
  try{
    const r = await fetch("/api/share/"+token);
    if(!r.ok){
      const e = await r.json().catch(()=>({}));
      document.getElementById("main").innerHTML=`<div class="card error-state"><h2>Report not available</h2><p>${e.error||"This link may have expired or been removed."}</p></div>`;
      return;
    }
    const {share,report,metadata}=await r.json();
    render(share,report,metadata);
  }catch(e){
    document.getElementById("main").innerHTML=`<div class="card error-state"><h2>Failed to load</h2><p>Please try again.</p></div>`;
  }
}

function render(share,r,meta){
  const color=scoreColor(r.overallScore);
  const gColor=gradeColor(r.grade);
  const unusedCount=meta?.unusedFields?.unusedFieldCount||0;
  const techDebt=meta?.techDebt||{};
  const actions=r.top5RecommendedActions||[];
  const cats=r.categories||{};
  const expiresDate=new Date(share.expires_at).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
  const generatedDate=new Date(r.generatedAt||share.created_at).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});

  document.title=`SF Health Report — ${r.orgName} (${r.overallScore}/100)`;

  document.getElementById("main").innerHTML=`
    <div class="share-meta">
      <div><div class="label">Shared Report</div><div class="val">${r.orgName} &nbsp;·&nbsp; Generated ${generatedDate}</div></div>
      <div style="font-size:12px;color:#6b7280">Link expires ${expiresDate}</div>
    </div>

    <div class="card">
      <h2>Overall Health Score <span style="font-size:12px;font-weight:500;color:#6b7280;background:#f3f4f6;padding:3px 10px;border-radius:99px;">${r.orgProfile?.label||"Standard"}</span></h2>
      <div class="score-hero">
        <div class="gauge-wrap">
          <svg width="150" height="96" viewBox="0 0 150 86">
            <path d="M 15 78 A 60 60 0 0 1 135 78" fill="none" stroke="#e2e8f0" stroke-width="13" stroke-linecap="round"/>
            <path d="M 15 78 A 60 60 0 0 1 135 78" fill="none" stroke="${color}" stroke-width="13"
              stroke-linecap="round" stroke-dasharray="${(r.overallScore/100*188).toFixed(1)} ${(188-(r.overallScore/100*188)).toFixed(1)}" pathLength="188"/>
          </svg>
          <div class="gauge-score" style="color:${color}">${r.overallScore}</div>
          <div class="gauge-grade" style="color:${gColor}">${r.grade}</div>
          <div class="gauge-sub">out of 100</div>
        </div>
        <div>
          <div class="stats-row">
            <div class="stat-box"><div class="val" style="color:#dc2626">${actions.filter(a=>a.priority==="critical").length}</div><div class="lbl">Critical Issues</div></div>
            <div class="stat-box"><div class="val" style="color:#ea580c">${actions.filter(a=>a.priority==="high").length}</div><div class="lbl">High Issues</div></div>
            <div class="stat-box"><div class="val">${unusedCount}</div><div class="lbl">Unused Fields</div></div>
            <div class="stat-box"><div class="val">${techDebt.totalApexClasses||"—"}</div><div class="lbl">Apex Classes</div></div>
            <div class="stat-box"><div class="val">${techDebt.staleApiVersionClasses||"—"}</div><div class="lbl">Stale API Classes</div></div>
            <div class="stat-box"><div class="val">${techDebt.totalVFPages||"—"}</div><div class="lbl">VF Pages</div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Category Breakdown</h2>
      ${Object.entries(cats).map(([k,v])=>`
        <div class="cat-row">
          <span class="cat-label">${CAT_LABELS[k]||k}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${v.score}%;background:${scoreColor(v.score)}"></div></div>
          <span class="cat-score-val" style="color:${scoreColor(v.score)}">${v.score}</span>
        </div>`).join("")}
    </div>

    <div class="card">
      <h2>Top Recommended Actions</h2>
      ${actions.length===0
        ? '<p style="color:#16a34a;font-weight:600;">No issues found — this org is in excellent health!</p>'
        : actions.map((a,i)=>`
          <div class="action-item">
            <div class="action-top">
              <span class="action-num">${i+1}</span>
              <span class="badge ${pClass(a.priority)}">${a.priority}</span>
              <span style="font-size:14px;color:#374151;padding-top:1px">${a.action}</span>
            </div>
          </div>`).join("")}
    </div>

    <div class="card">
      <h2>Export</h2>
      <div class="dl-row">
        <button class="dl-btn pdf" onclick="window.print()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
          Print / Save as PDF
        </button>
      </div>
      <p style="font-size:12px;color:#a0aec0;margin-top:12px;">Use your browser's print dialog and choose "Save as PDF" as the destination.</p>
    </div>

    <div class="watermark">
      Report generated by <a href="/">SF Health Dashboard</a> &nbsp;·&nbsp; ${generatedDate}
    </div>
  `;
}

load();
</script>
</body>
</html>
