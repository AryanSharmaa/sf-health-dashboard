services:
  - type: web
    name: sf-health-dashboard
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://sf-health-dashboard.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: sf-health-db
          property: connectionString
      - key: SF_CLIENT_ID
        sync: false          # set manually in Render dashboard
      - key: SF_CLIENT_SECRET
        sync: false          # set manually in Render dashboard
      - key: GEMINI_API_KEY
        sync: false          # free AI — get key at aistudio.google.com (1M tokens/day free)
      - key: ANTHROPIC_API_KEY
        sync: false          # optional paid fallback — only used if Gemini key not set
      - key: ADMIN_KEY
        sync: false          # secret key to access /api/admin/* endpoints
      - key: SMTP_HOST
        sync: false          # e.g. smtp.gmail.com — for scheduled audit emails
      - key: SMTP_PORT
        sync: false          # 587 (TLS) or 465 (SSL)
      - key: SMTP_USER
        sync: false          # your email address
      - key: SMTP_PASS
        sync: false          # app password (Gmail) or SMTP password
      - key: SMTP_FROM
        sync: false          # e.g. SF Health Dashboard <you@company.com>
      # PORT is injected by Render at runtime — do not override it here

databases:
  - name: sf-health-db
    plan: free
    databaseName: sfhealth
    user: sfhealth
