services:
  - type: web
    name: sf-health-dashboard
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sf-health-db
          property: connectionString
      - key: PORT
        value: 3000

databases:
  - name: sf-health-db
    plan: free
    databaseName: sfhealth
    user: sfhealth
