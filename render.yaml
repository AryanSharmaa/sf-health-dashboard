services:
  - type: web
    name: sf-health-dashboard
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://sf-health-dashboard.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: sf-health-db
          property: connectionString
      - key: SF_CLIENT_ID
        sync: false          # set manually in Render dashboard
      - key: SF_CLIENT_SECRET
        sync: false          # set manually in Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false          # optional — fallback AI when Einstein not on customer's org
      - key: ADMIN_KEY
        sync: false          # secret key to access /api/admin/* endpoints
      - key: PORT
        value: 3000

databases:
  - name: sf-health-db
    plan: free
    databaseName: sfhealth
    user: sfhealth
